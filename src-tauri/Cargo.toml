[package]
name = "taskproxy"
version = "0.1.113"
description = "Stoic Dreams Task Proxy"
authors = [
    "Erik Gassler <erik@stoicdreams.com>",
    "Stoic Dreams <support@stoicdreams.com>",
]
license = "MIT"
repository = "https://www.github.com/StoicDreams/TaskProxyApp"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "task_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [
    "devtools",
    "rustls-tls",
    "tray-icon",
    "webview-data-url",
] }
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = "1.1"
tauri-plugin-fs = { version = "2.2", features = ["watch"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.2"
keyring = { version = "4.2", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "dbus-secret-service-keyring-store",
] }
tokio = { version = "1.44", features = ["full"] }
aes-gcm = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.10"
hex = "0.4"
thiserror = "2.0"
sha2 = "0.11"
uuid = { version = "1.16", features = ["v7"] }
base64 = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastembed = { version = "6.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
emojis = "0.9"
git2 = { version = "0.19", features = ["vendored-openssl"] }
chrono = "0.4"
tauri-plugin-updater = { version = "2.13.3", features = ["rustls-tls"] }
ignore = "0.4"
portable-pty = "0.9"
# Already built for the updater. Used to ask Git servers for CI results.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-window-state = "2"

# [features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
# custom-protocol = ["tauri/custom-protocol"]
