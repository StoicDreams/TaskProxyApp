name: "Build and Publish"

on:
  push:
    branches:
      - main

env:
  VERSION: 0.1.113

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # ort-sys links from its download folder, so that folder must be cached along with target/.
          prefix-key: v1-rust
          cache-directories: ~/.cache/ort.pyke.io
      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: install dependencies
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          rustup target add wasm32-unknown-unknown
      - name: build frontend
        run: trunk build
      - name: run tests
        run: cargo test -p taskproxy
      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install UI test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The minified files are what the app loads, so test those.
      - name: run UI tests
        run: npm run test:min
  build-tauri-windows:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: ~/AppData/Local/ort.pyke.io
      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: trunk, tauri-cli
      - name: install dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Az.Accounts
          Install-Module -Name Az.CodeSigning
          Install-Module -Name TrustedSigning
      - name: build executable
        run: |
          cargo tauri build --no-bundle
      - name: sign executable
        if: true
        run: |
          $EVAS = '${{ secrets.EV_AZURE_SECRET }}'
          $EVAC = '${{ secrets.EV_AZURE_CLIENT }}'
          $EVAT = '${{ secrets.EV_AZURE_TENANT }}'
          $secPassword = ConvertTo-SecureString $EVAS -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($EVAC, $secPassword)
          Connect-AzAccount -ServicePrincipal -TenantId $EVAT -Credential $credential
          Invoke-TrustedSigning -Endpoint ${{ secrets.EV_AZURE_ENDPOINT }} -CodeSigningAccountName ${{ secrets.EV_AZURE_ACCOUNT }} -CertificateProfileName ${{ secrets.EV_AZURE_PROFILE }} -FileDigest sha256 -Files "${{ github.workspace }}\target\release\taskproxy.exe" -TimestampRfc3161 http://timestamp.acs.microsoft.com -TimestampDigest sha256
      - name: build bundles
        if: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EV_AZURE_SECRET: ${{ secrets.EV_AZURE_SECRET }}
          EV_AZURE_CLIENT: ${{ secrets.EV_AZURE_CLIENT }}
          EV_AZURE_TENANT: ${{ secrets.EV_AZURE_TENANT }}
          EV_AZURE_ENDPOINT: ${{ secrets.EV_AZURE_ENDPOINT }}
          EV_AZURE_ACCOUNT: ${{ secrets.EV_AZURE_ACCOUNT }}
          EV_AZURE_PROFILE: ${{ secrets.EV_AZURE_PROFILE }}
        run: |
          cargo tauri bundle
      - name: Save Windows files to artifact
        if: true
        uses: actions/upload-artifact@v4
        with:
          name: taskproxyartifactswindows
          path: |
            target\release\bundle\
  build-tauri-mac:
    needs: test
    if: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: ~/Library/Caches/ort.pyke.io
      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: install dependencies
        run: |
          # softwareupdate --install -a
      - name: install frontend dependencies
        run: |
          brew update
          rustup target add wasm32-unknown-unknown
          cargo build --release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Task Proxy v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-apple-darwin'
      - name: Save Mac files to artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskproxyartifactsmac
          path: |
            target/aarch64-apple-darwin/release/bundle/
  build-tauri-ubuntu:
    needs: test
    if: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: ~/.cache/ort.pyke.io
      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: install dependencies
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: install frontend dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Task Proxy v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: true
      - name: Save Ubuntu files to artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskproxyartifactsubuntu
          path: |
            target/release/bundle/
  publish-tauri-windows:
    needs: build-tauri-windows
    if: true
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taskproxyartifactswindows
          path: bundle
      - name: SFTP upload
        uses: garygrossgarten/github-action-scp@release
        with:
          host: ${{ secrets.CDN_SERVER_DOMAIN }}
          username: ${{ secrets.CDN_SERVER_USER }}
          password: ${{ secrets.CDN_SERVER_PW }}
          port: ${{ secrets.CDN_SERVER_PORT }}
          local: "bundle"
          remote: "${{ secrets.CDN_APP_PATH }}/task-proxy/win/${{ env.VERSION }}/"
  publish-tauri-mac:
    needs: build-tauri-mac
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taskproxyartifactsmac
          path: bundle
      - name: SFTP upload
        uses: garygrossgarten/github-action-scp@release
        with:
          host: ${{ secrets.CDN_SERVER_DOMAIN }}
          username: ${{ secrets.CDN_SERVER_USER }}
          password: ${{ secrets.CDN_SERVER_PW }}
          port: ${{ secrets.CDN_SERVER_PORT }}
          local: "bundle"
          remote: "${{ secrets.CDN_APP_PATH }}/task-proxy/mac/${{ env.VERSION }}/"
  publish-tauri-ubuntu:
    needs: build-tauri-ubuntu
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taskproxyartifactsubuntu
          path: bundle
      - name: SFTP upload
        uses: garygrossgarten/github-action-scp@release
        with:
          host: ${{ secrets.CDN_SERVER_DOMAIN }}
          username: ${{ secrets.CDN_SERVER_USER }}
          password: ${{ secrets.CDN_SERVER_PW }}
          port: ${{ secrets.CDN_SERVER_PORT }}
          local: "bundle"
          remote: "${{ secrets.CDN_APP_PATH }}/task-proxy/ubu/${{ env.VERSION }}/"
  cdn-update-app-catalog:
    runs-on: ubuntu-latest
    needs: [publish-tauri-windows, publish-tauri-mac, publish-tauri-ubuntu]
    if: true
    steps:
      - name: update app catalog
        run: |
          ${{ secrets.WEB_DEPLOY_PREFIX }}cdnapps ${{ secrets.WEB_DEPLOY_POSTFIX }}
