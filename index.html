    <script type="text/javascript">
        {

    <script type="text/javascript">
        {
            // Send external links to OS to open in default app.
            document.body.addEventListener('click', ev => {
                const target = webui.closest(ev, 'a');
                if (!target) return;
                let href = target.getAttribute('href');
                if (!href || href.split('://').length === 1) return;
                ev.stopPropagation();
                ev.preventDefault();
                webui.proxy.openUrl(href);
                return false;
            });
            // In a remote browser the frame's page is www.taskproxy.com's to leave, so it must not ask to stay.
            if (location.host !== '127.0.0.1:1426' && !window.__taskProxyRemote) {
                // Pause any attempts to navigate away from app.
                window.addEventListener('beforeunload', ev => {
                    ev.stopPropagation();
                    ev.preventDefault();
                    return false;
                });
            }
        }
    </script>
